s-lidar":"top-left","maplibre-gl-streetview":"top-right","maplibre-gl-mapillary":"top-left","geolibre-elevation-profile":"top-left","maplibre-gl-swipe":"top-left","maplibre-gl-components":"top-right"},"settings":{}},"legend":{"title":"Virtuaalimatkan kohteet","groupByLayer":true,"order":["viikinki-paapysakit","viikinki-sivukohteet","viikinki-reitti"],"overrides":{}},"storymap":{"title":"Karttaretki viikinkiajan jäljillä","subtitle":"Satakunnan arkeologiaa 800–1050 jaa. Haudoista asuinpaikoille ja avoimiin kysymyksiin","byline":"GeoLibre StoryMaps · Tekijä & toimitus: Nina Mäki-Kihniä, 2026. Lähteet: VARK, Kyppi, Finna. Sivusto on tekninen harjoitus, ja toteutus sisältää AI-avusteisia ja -generoituja vaiheita. Virheet ovat mahdollisia.","footer":"Lähteet: 2026. VARK, KYPPI ja AI-avusteinen tiedonseulonta.","theme":"light","showMarkers":false,"markerColor":"#9a4f2c","inset":false,"insetPosition":"bottom-right","hideChapterNav":true,"startSlide":"none","endSlide":"none","chapters":[{"id":"00-alku","title":"Karttaretki viikinkiajan jäljillä","description":"\u003cstrong>Satakunnan viikinkiajan kohteita eli noin 800–1050 jaa.\u003c/strong>\u003cbr>Miten viikinkiajan jälkiä luetaan Satakunnan maisemasta? Karttaretki lennättää sinut haudoilta linnavuorelle, raudanvalmistuksesta asuinpaikoille ja lopuksi kohteeseen, jossa kiinnostavin vastaus on vielä löytämättä.\u003cbr>\u003cbr>Katso karttaa. Yhdeksän pysähdystä pilkistävät jo. Vieritä näkymää alaspäin, niin pääset kohteesta toiseen tekstin tahdissa. Kohteiden välissä kartta palaa hetkeksi yleisnäkymään, jotta matkan suunta hahmottuu. Esiin nousevaa virtuaalisen matkaoppaan selostusta voit vierittää omassa kehyksessään ylös ja alas, kun ensin klikkaat kehystä. Kehyksessä alinna on linkit lähteisiin ja GoogleMapsiin, jossa voit valita satelliittinäkymän ja tarkastella nykytilaa. \u003cbr>\u003cbr>Tarina kuljettaa, mutta arkeologinen juoni tukeutuu tutkittuun löytöön, rakenteeseen tai ajoitukseen. Satakunnan viikinkiaika sijoittuu Satakunnan rautakauden (n. 500 eaa. - 1300 jaa.) loppupuolelle.","alignment":"full","hidden":false,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"jumpTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"01-eura","title":"1/9 · TUHATVUOTINEN","description":"\u003csmall>Euran Luistarin kalmistoalue. Kuva: Leena Koivisto, Museovirasto, 2009, Finna. CC BY 4.0. \u003ca href=\"https://www.finna.fi/Record/museovirasto.6F835FF3661121A7538996C48C5279EF?sid=5451478102\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>LUISTARI - tuhat vuotta kuolleiden maisemaa\u003c/strong>\u003cbr>\u003cbr>Luistarista on tutkittu yli 1 300 hautaa. Niistä noin 300 kuuluu viikinkiaikaan. Esinevarustus alkaakin runsastua vuoden 800 tienoilla.\u003cbr>\u003cbr>Kun saapuu Luistariin, yksittäisen miekan ja korun lisäksi mieltä lumoaa historian mittakaava. Ruumiskalmisto on saanut alkunsa jo 500-luvun lopulla ja ollut käytössä viikinkiajan läpi. Siksi Luistari antaa mahdollisuuden tarkastella väestöjä: miten vainajia puettiin, mitä heidän mukaansa asetettiin ja miten tavat muuttuivat vuosisatojen kuluessa.\u003cbr>\u003cbr>Samassa Euran maisemassa Käräjämäki-Osmanmäki, Pappilanmäki ja Yli-Nuoranne muistuttavat, ettei yksi kuuluisa kalmisto kerro koko tarinaa.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Hautojen korut, aseet, puvun osat ja säilyneet tekstiilit kertovat identiteetistä, varallisuudesta ja kontakteista – mutta vain, jos löydöt luetaan yhdessä hautakontekstin kanssa.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Käydään katsomassa hautalöytöä 56.\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=50010032\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=50010032\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.11261928,22.14658815\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/01_eura_luistari.jpg","alignment":"left","hidden":false,"location":{"center":[22.14658815,61.11261928],"zoom":13.4,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"01b-eura-syvennys","title":"EMÄNTÄ","description":"\u003csmall>Euran emännän rekonstruoitu puku. Kuva: Matti Bergström, Museovirasto, 1983, Finna. CC BY 4.0 \u003ca href=\"https://www.finna.fi/Record/musketti.M012:AKD7157:1\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>LUISTARI - Yksi hauta, satoja vertailukohteita\u003c/strong>\u003cbr>\u003cbr>Luistari ei ole vain “Euran emännän hauta”. Yli 1 300 tutkittua ruumishautaa tekevät paikasta aineiston, jossa voidaan kysyä väestötason kysymyksiä. Haudasta 56 tunnettu 1000-luvun \"Euran emännän\" puku (\u003ca href=\"https://fi.wikipedia.org/wiki/Euran_em%C3%A4nt%C3%A4\" target=\"_blank\" rel=\"noopener\">lisää Wikipediassa\u003c/a>) on silti erinomainen lähikuva: korut, puvun metalliosat ja säilyneet tekstiilit osoittavat, että vanha hauta voi kertoa paljon pukeutumisesta – mutta rekonstruktio vaatii paljon tulkintaa.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Käräjämäki-Osmanmäki tuo rinnalle hautaustavan muutoksen, jossa näkyy siirtymä ja rinnakkaisuus ruumishautauksen ja polttohautauksen välillä sekä hautaustapojen moninaistuminen. Pappilanmäki taas opettaa ajoituskritiikkiä: kaikki näyttävä rautakautinen esine ei ole automaattisesti viikinkiaikainen.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Jos yhteisö pystyi sijoittamaan näin paljon esineitä ja työtä vainajiinsa, miten se suojeli ja hallitsi ympäröivää maisemaa?\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=50010032\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=50010032\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://journal.fi/iskos/article/view/143134/90575\" target=\"_blank\" rel=\"noopener\">Tutkimus\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.11261928,22.14658815\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/02_eura_emanta_geolibre.jpg","alignment":"left","hidden":false,"location":{"center":[22.14,61.125],"zoom":12,"pitch":0,"bearing":0},"mapAnimation":"easeTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"01x-eura-siirtyma","title":"Luistari → Kauttuan linnavuori","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"02-kauttua","title":"2/9 · VARTIO","description":"\u003csmall>Kauttuan linnavuori Eurassa. Kuva: Leena Koivisto, Satakunnan Museo, 2011, Finna. CC BY 4.0. \u003ca href=\"https://satakunnanmuseo.finna.fi/Search/Results?lookfor=Kauttuan+linnavuori+Eurassa.+Kuva%3A+Leena+Koivisto%2C+2011&type=AllFields\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>KAUTTUAN LINNAVUORI — mäki, jolta vartioitiin jokireittiä\u003c/strong>\u003cbr>\u003cbr> Olet saapunut Ala-Satakunnan ainoalle linnavuorelle! Koillis- ja pohjoispuolta hallitsee jyrkkä kallionseinämä, muut mäenrinteet laskevat loivemmin ympäröivään, alavaan peltomaahan. Tutkimusnäyttö ajoittaa paikan käytön 700–800-luvuille, eli loppuvaihe osuu viikinkiaikaan.\u003cbr>\u003cbr>\u003cstrong>Käännä katse miekoista mäkeen ja maisemaan\u003c/strong>\u003cbr>Kartalla linnavuoren suhde Eurajokeen, Pyhäjärveen ja Euran kalmistoihin on olennaisempi kuin yksittäinen löytöesine.\u003cbr>\u003cbr>Linnavuoren loivemmilla reunoilla näkyy kivisten vallien perustuksia, ja vallien rajaama laki on yllättävän pieni (40 x 30 m). Mahdollinen porttiaukko ja ulomman varustuksen jäännökset herättävät paikasta konkreettisen kysymyksen: mitä tällä kohdalla haluttiin hallita tai suojata?\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Linnavuori on tulkittu edustavaksi ja harvinaiseksi rautakautiseksi puolustusvarustukseksi. Se todistaa, että viikinkiajan Satakuntaa kannattaa tarkastella myös maiseman ja liikkumisreittien kautta.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Puolustus tarvitsee metallia: mistä aseiden ja työkalujen rauta tuli?\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=50010023\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=50010023\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.10553316,22.15615201\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/03_kauttua_linnavuori.jpg","alignment":"right","hidden":false,"location":{"center":[22.15615201,61.10553316],"zoom":13.4,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"02x-kauttua-siirtyma","title":"Kauttuan linnavuori → Tupamäki","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"03-tupamaki","title":"3/9 · KUONA","description":"\u003csmall>Rautakuonaa Tupamäellä. Kuva: Teija Tiitinen, Museovirasto, 2021, Finna. CC BY 4.0. \u003ca href=\"https://finna.fi/Record/museovirasto.013353e5-d960-40e3-8a7d-99fe91eb5cb2?sid=5451487213\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>TUPAMÄKI — ennen miekkaa oli kuona\u003c/strong>\u003cbr>\u003cbr> Viikinkiajan metalliesine on helppo nähdä pelkkänä valmiina tuotteena: miekka, solki, neula. Tupamäki auttaa katsomaan vaihetta, joka edeltää esinettä.\u003cbr>\u003cbr>Ennen kiiltävää terää oli raskas, sotkuinen tuotantoprosessi.\u003cbr>\u003cbr>Maasta on löytynyt raudansulatuskuoppia, palkeen suukappaleiden katkelmia, hioinkiviä ja valtava määrä kuonaa – aineistoa, joka kertoo työn lämmöstä, savusta ja epäonnistuneistakin sulatuksista. Tupamäeltä rautakuonaa löydettiin yli 200 kiloa. Viisi raudansulatusrakennetta on ajoitettu merovingi- ja viikinkiaikaan.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Rautakauden raudanvalmistuspaikka on harvinainen. Tupamäki tekee näkyväksi erikoistuneen käsityön ja sen, että metallin arvo syntyi jo paljon ennen valmista asetta.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Rauta saattoi muuttua työkaluksi, koruksi tai aseeksi – mutta kenellä oli oikeus kantaa kaikkein näyttävimpiä aseita hautaan?\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=783010007\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/to.aspx?id=112.783010007\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.018787,22.39879688\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/04_tupamaki_rautakuona.jpg","alignment":"left","hidden":false,"location":{"center":[22.39879688,61.018787],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"03x-tupamaki-siirtyma","title":"Tupamäki → Vanhakartano C / Lallin kalmisto","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"04-koylio","title":"4/9 · AARTEET","description":"\u003csmall>Köyliön Vanhakartanon C-kalmiston kaivausdokumentaatio. Kuva: A. Hackman, 1925 (Kaivausraportti). Kyppi. ·\u003ca href=\"https://www.kyppi.fi/to.aspx?id=129.130352\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>KÖYLIÖ — haudat täynnä aseita, hopeaa ja koiria\u003c/strong>\u003cbr>\u003cbr>900-luvun lopulta alkavan C-kalmiston rikkaissa miesten haudoissa oli hopeakoristeisia miekkoja ja muita aseita; naisten haudoissa muun muassa helminauhoja, joihin kuului hopearahoja. Kahdessa haudassa oli mahdollisesti koiran jäännöksiä.\u003cbr>\u003cbr>Tämä on kohta, jossa aineisto kuulostaa melkein liian täydelliseltä viikinkitarinalta: aseita, hopeaa, koruja ja ehkä koiria.\u003cbr>\u003cbr>Arkeologin tehtävä on kuitenkin vastustaa liian helppoa kertomusta.\u003cbr>\u003cbr>Vanhakartanon C-kalmistossa vainajia haudattiin puuarkkuihin, ja tietueissa mainitaan myös käärinliinoina eläinten nahat, joidenkin arkkujen päälle asetellut tuohet ja päällekkäiset hautaukset. Monipuoliset hauta-antimet kertovat myös rituaaleista ja yhteisön tekemistä valinnoista – eivät vain vainajan elämästä.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Kohde herättää kiinnostuksen aseista, pukeutumisesta, statuksesta ja eläimistä sekä kansainvälisistä yhteyksistä, sillä mukana oli hopearahoja ja skandinaavisia esinetyyppejä Itämeren ja Skandinavian alueelta.\u003cbr>\u003cbr>Nimi “Lallin kalmisto” ei ole arkeologinen todiste yhteydestä legendan Lalliin, mutta kappeli kalmiston lähellä on seissyt ainakin jo vuonna 1688.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Kaikkia vainajia ei kuitenkaan haudattu ruumiina – mitä tapahtui yhteisöissä, joissa polttaminen jatkui?\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/to.aspx?id=112.319010018\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.kyppi.fi/to.aspx?id=129.130352\" target=\"_blank\" rel=\"noopener\">Tutkimus\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.124424,22.346131\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/05_koylio_lallin_kalmisto.jpg","alignment":"right","hidden":false,"location":{"center":[22.346131,61.124424],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"04b-koylio-syvennys","title":"VÄLIKOMMENTTI: KOIRA?","description":"\u003cstrong>Mitä koira tekee haudassa?\u003c/strong>\u003cbr>\u003cbr>Kahdessa C-kalmiston haudassa on tulkittu olevan mahdollisia koiran jäännöksiä. Se on kiehtova havainto, mutta ei oikotie valmiiseen rituaalitarinaan.\u003cbr>\u003cbr>Eläinluun paikka, säilyneisyys ja suhde vainajaan ratkaisevat, mitä voidaan perustellusti sanoa.\u003cbr>\u003cbr>Sama pätee hopearahoihin ja aseisiin. Ne osoittavat esineiden, materiaalien ja vaikutteiden liikkumista – mutta “kauppias”, “soturi” tai “päällikkö” ovat jo tulkintoja, eivät esineisiin kaiverrettuja ammattinimikkeitä.\u003cbr>\u003cbr>Hyvä arkeologinen tarina ei ole tylsempi siksi, että se jättää osan kysymyksistä avoimiksi. Usein juuri epävarmuus tekee löydöstä kiinnostavan.","alignment":"center","hidden":false,"location":{"center":[22.346131,61.124424],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"easeTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"04x-koylio-siirtyma","title":"Vanhakartano C / Lallin kalmisto → Tuhkanummi","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"05-tuhkanummi","title":"5/9 · TUHKA ","description":"\u003csmall>Säkylän Tuhkanummen rautakautinen polttokenttäkalmisto. Kuva: Teemu Väisänen, Satakunnan Museo, 2019, Finna. CC BY 4.0. \u003ca href=\"https://www.finna.fi/Record/satakunnanmuseo.7D6C0753-9E1E-41AE-BB9A-40D597753CFE?sid=5451527365\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>TUHKANUMMI — poltettu vainaja, piiloon jäävä hauta\u003c/strong>\u003cbr>\u003cbr>Polttorovion jäännökset kätkettiin mataliin kuoppiin. Löytöjen perusteella kalmisto on ajanjaksolta 550–1050, ja eli merovingiajalta viikinkiajan loppuun.\u003cbr>\u003cbr>Tuhkanummella hauta ei tarjoa lukijalle selkeää arkkua tai näkyvää kivirakennetta. Polttorovion jäännöksiä sijoitettiin mataliin kuoppiin, ja suuri osa siitä, mitä hautauksesta oli jäljellä, jäi maan alle lähes näkymättömäksi.\u003cbr>\u003cbr>Kohdetta kaivettiin jo 1800-luvun lopulla ja 1900-luvun alussa, ja paikalle pystytettiin vuonna 1901 “Tuhatvuotinen kalmisto” -muistokivi.\u003cbr>\u003cbr>Silti kalmiston tarkkaa laajuutta ei vieläkään tunneta.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Tuhkanummi on polttokenttäkalmistona hyvä vastapaino Euran ja Köyliön ruumishaudoille: viikinkiajan Satakunnassa ei ollut yhtä ainoaa tapaa käsitellä vainajia.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Miten arkeologi löytää elävän yhteisön jäljet? Seuraavassa kohteessa siirrytään hautausmailta asuinpaikalle.\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=319010016\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/to.aspx?id=112.319010016\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.16683534,22.30369221\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/06_tuhkanummi.jpg","alignment":"left","hidden":false,"location":{"center":[22.30369221,61.16683534],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"05x-tuhkanummi-siirtyma","title":"Tuhkanummi → Villiönsuvanto","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"06-villio","title":"6/9 · KOTI","description":"\u003csmall>Liesi Kokemäen Villiönsuvannon rautakautisella asuinpaikalla. Kuva: Leena Koivisto, Satakunnan Museo, 2019, Finna. CC BY 4.0.  \u003ca href=\"https://www.finna.fi/Record/satakunnanmuseo.35BBE115-BF9A-49D9-BF26-D7D9114DE840?sid=5451492481\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>VILLIÖNSUVANTO — missä viikinkiajan ihmiset asuivat?\u003c/strong>\u003cbr>\u003cbr> Paikalta on löytynyt yli kymmenen paalurakenteisen rakennuksen jäännöksiä – ja samalta peltoalueelta viikinkiaikaisia kupura- ja tasavarsisoljen katkelmia. Rakennusten kaikkia vaiheita ei kuitenkaan voida automaattisesti ajoittaa viikinkiaikaan.\u003cbr>\u003cbr>Kalmistot ovat näyttäviä, koska hautaan voidaan koota kokonainen esineistö.\u003cbr>\u003cbr>Asuinpaikka on toisenlainen arkeologinen palapeli: paalunjälkiä, liesiä, keramiikkaa, viljanjyviä ja pieniä metalliesineitä - linturiipuskin.\u003cbr>\u003cbr>Villiönsuvannossa on tutkittu yli kymmenen paalurakenteisen rakennuksen jäännöksiä. Viikinkiaikaiset soljenkatkelmat osoittavat paikan yhteyden aikakauteen, mutta hyvä arkeologi ei tee siitä automaattisesti “viikinkikylää”: rakennusten kaikki käyttöjaksot eivät ole yhtä tarkasti ajoitettuja.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Villiönsuvantoa pidetään toistaiseksi laajimpana tutkittuna rautakautisena asuinpaikkana, jossa on suuri määrä paalurakenteita. Se siirtää katseen hautojen näyttävyydestä ja riiteistä arkisiin jälkiin.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Asuinpaikka kertoo arjesta, mutta joen varren vanhat kalmistot muistuttavat yhä, että sama maisema säilyi merkityksellisenä sukupolvesta toiseen.\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=1000036786\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=1000036786\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.26310451,22.33148992\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","image":"https://ninalista.github.io/Rautakausiretki/images/07_villionsuvanto_liesi.jpg","alignment":"right","hidden":false,"location":{"center":[22.33148992,61.26310451],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"06x-villio-siirtyma","title":"Villiönsuvanto → Perävainionmäki","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"07-kokemaki","title":"7/9 · KERROKSET","description":"\u003csmall>Rautakautinen röykkiö. Kuva: Teemu Väisänen, Satakunnan Museo, 2019, Finna. CC BY 4.0. \u003ca href=\"https://www.finna.fi/Record/satakunnanmuseo.1B849E63-5698-4CFD-85CB-AD848F3457ED?sid=5451494515\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>PERÄVAINIONMÄKI — hauta haudan sisällä\u003c/strong>\u003cbr>\u003cbr>Perävainionmäen yhdessä röykkiössä oli viikinkiaikainen nainen, eli hän oli haudassa jo toinen leposijan saanut.\u003cbr>\u003cbr>Perävainionmäellä sama paikka ei kuitenkaan tarkoita yhtä aikaa.\u003cbr>\u003cbr>Röykkiöiden alta on löytynyt pronssikautista, jopa kivikautista kulttuuria. Viikinkinaisen ja häntä edeltäneen polttohaudatun vainajan alla oli kivikautista astutusjälkeä.\u003cbr>\u003cbr>Perävainionmäki kuuluu arvokkaaseen Kokemäen Teljän muinaisjäännösten kokonaisuuteen. Esimerkiksi läheinen Leikkimäki laajentaa kokonaisuutta polttokenttäkalmistolla, kuppikivillä ja myöhemmillä metallinetsinlöydöillä.\u003cbr>\u003cbr>Kokemäenjoen rantamaisema muistuttaa konkreettisesti, kuinka ihmiset voivat palata samoihin paikkoihin vuosisatojen ajan – joskus ilman, että me pystymme todistamaan muistamisen mekanismia saati jäsentelemään tapahtumia.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Tämän luvun arkeologinen avainsana on kerrostuneisuus. Se, että löydöt ovat samassa paikassa, ei tarkoita, että ne kuuluvat samaan hetkeen tai edes samaan hautaustapaan.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Esine voi kertoa ajankohdasta – mutta voiko pelkkä esinekeskittymä kertoa, oliko paikalla koti, markkinapaikka vai jotakin muuta?\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/vark.aspx?id=271010014\" target=\"_blank\" rel=\"noopener\">VARK\u003c/a> · \u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=271010015\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.26945224,22.36600132\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>\u003cbr>","image":"https://ninalista.github.io/Rautakausiretki/images/08_peravainionmaki.jpg","alignment":"left","hidden":false,"location":{"center":[22.36600132,61.26945224],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"07x-kokemaki-siirtyma","title":"Perävainionmäki → Yli-Forsby","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"08-yli-forsby","title":"8/9 · ARVOITUS ","description":"\u003cstrong>YLI-FORSBY — esineitä ilman valmista tarinaa\u003c/strong>\u003cbr>\u003cbr>Pellosta on löytynyt metallinetsinnässä miekanponnen osa, punnuksia ja muita myöhäisrautakautisia esineitä, mutta vuoden 2023 inventointi ei vielä paljastanut niihin liittyvää kulttuurikerrosta.\u003cbr>\u003cbr>\u003cstrong>Tässä kohtaa tekee mieli sanoa “kauppapaikka”.\u003c/strong>\u003cbr>Punnukset, miekanponnen osa ja muu myöhäisrautakautinen metalliaineisto houkuttelevat rakentamaan valmiin kertomuksen kaupasta, liikkumisesta ja ehkä markkinoista.\u003cbr>\u003cbr>Mutta arkeologinen kenttätyö ei vielä tue näin pitkää loikkaa: pintapoiminta ei osoittanut varmaa rautakautista kulttuurikerrosta tai rakennetta.\u003cbr>\u003cbr>Siksi Yli-Forsby on yksi matkan tärkeimmistä pysähdyksistä – koska sen tarina ei ole valmis.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Metallinilmaisin voi löytää esineen, mutta löytökeskittymän luonne ratkaistaan vasta kontekstin, rakenteiden ja maakerrosten kerrostumien (stratigrafian) avulla.\u003cbr>\u003cbr>“Mahdollinen” on joskus arkeologin tarkin sana.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Mitä tapahtuu, kun esine ei puhdistukaan heti vaan sen ympärille jätetään tarkoituksella hieman maata tutkittavaksi?\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=1000041727\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.273338,22.314517\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","alignment":"right","hidden":false,"location":{"center":[22.314517,61.273338],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"08x-yli-forsby-siirtyma","title":"Yli-Forsby → Hankkasmäki","description":"","alignment":"center","hidden":true,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"09-hankkasmaki","title":"9/9 · SOLKI","description":"\u003csmall>Viikinkiaikainen kupurasolki (KM47011) löytyi kairalla merkitystä kohdasta. Taustalla historiallisen ajan rakennuksen raunio. Kuva: Teemu Väisänen, Satakunnan Museo,  2024, Finna. CC BY 4.0. \u003ca href=\"https://www.finna.fi/Record/satakunnanmuseo.087e7fbf-db2b-4df9-b53f-230ef99fc9e0?sid=5451496576\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>HANKKASMÄKI — kupurasolki ja... mitä muuta?\u003c/strong>\u003cbr>\u003cbr> Nyt tulit aivan ajankohtaiseen arkeologian maisemaan Satakunnassa! Keväällä 2024 Hankkasmäeltä löydettiin kaksi kupurasolkea ja pronssihelmi; myöhemmin vielä kolmas kupurasolki. Yhden soljen ympäriltä talteen otetusta maasta löytyi palanutta luuta – vihje, joka muutti löytöpaikan mahdolliseksi hautapaikaksi.\u003cbr>\u003cbr>Metsäkoneen muokkaamasta maasta löytyneet soljet olisivat voineet jäädä pelkiksi näyttäviksi metalliesineiksi. Sen sijaan yhden soljen ympärille jätetty maa tutkittiin tarkemmin.\u003cbr>\u003cbr>Mikroarkeologia selittää, miksi arkeologi ei aina halua puhdistaa löytöä heti: mukana kulkenut maa-aines voi säilyttää palanutta luuta, kuituja, karvaa tai höyhenten hitusia – sellaista, mikä katoaa helposti näkyvistä muttei välttämättä analyysistä.\u003cbr>\u003cbr>\u003cstrong>Mitä tästä kannattaa ajatella?\u003c/strong>\u003cbr>Sukupolvien ja maan elämän jäljet ovat sekoittuneet, mutta ainakin Hankkasmäen mahdollinen hauta on ajoitettu rautakauden viikinkiaikaan.\u003cbr>\u003cbr>\u003cstrong>Matka jatkuu!\u003c/strong>\u003cbr>Löytö ei ole valmis tarina, vaan kysymys, joka on dokumentoitava laajasti ennen kuin siihen vastataan.\u003cbr>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=1000020313\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://doi.org/10.61258/mt.173127\" target=\"_blank\" rel=\"noopener\">Tutkimus\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.18273272,22.06826272\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>\u003cbr>","image":"https://ninalista.github.io/Rautakausiretki/images/10_hankkasmaki_kupurasolki.jpg","alignment":"left","hidden":false,"location":{"center":[22.06826272,61.18273272],"zoom":13.1,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"09b-hankkasmaki-syvennys","title":"MIKRÖJÄLJET","description":"\u003cstrong>Hankkasmäki – soljen ympärillä säilynyt maailma\u003c/strong>\u003cbr>\u003cbr>Hankkasmäen viikinkiaikaisen soljen tutkimus on esimerkki siitä, miten aivan pieni määrä esineeseen tarttunutta maata voi poikia uuden tutkimuskysymyksen.\u003cbr>\u003cbr>Kiinnostavin ”löytö” ei siis ole vain esine, vaan sen koko löytökonteksti, ympäröivä kokonaisuus pienistä maamuruista maisemaan. Hankkasmäki on hieno osoitus siitä, miten menneisyyden tietoa kerätään ja tulkitaan lisää juuri nyt. \u003cbr>\u003cbr>\u003cstrong>Tänne on hyvä päättää virtuaalimatka: menneisyys ei avaudu yhdellä näyttävällä löydöllä, vaan sillä, miten löytö otetaan talteen ja mitä siltä osataan kysyä.\u003c/strong>\u003cbr>\u003csmall>\u003ca href=\"https://www.kyppi.fi/palveluikkuna/mjreki/read/asp/r_kohde_det.aspx?KOHDE_ID=1000020313\" target=\"_blank\" rel=\"noopener\">KYPPi\u003c/a> · \u003ca href=\"https://doi.org/10.61258/mt.173127\" target=\"_blank\" rel=\"noopener\">Tutkimus\u003c/a> · \u003ca href=\"https://www.google.com/maps/search/?api=1&amp;query=61.18273272,22.06826272\" target=\"_blank\" rel=\"noopener\">Google Maps / satelliitti\u003c/a>\u003c/small>","alignment":"center","hidden":false,"location":{"center":[22.068,61.1827],"zoom":14.2,"pitch":0,"bearing":0},"mapAnimation":"easeTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]},{"id":"99-loppu","title":"IHMETTELE LISÄÄ","description":"\u003csmall>Hankkasmäki on peltojen ympäröimä metsäinen mäki. Kuvassa etualalla Eurajoki. Kuva: Teemu Väisänen, Muinaistutkija 3/2025. Lähde: Muinaistutkija 3/2025 (Teemu Väisänen & Tuija Kirkinen). \u003ca href=\"https://doi.org/10.61258/mt.173127\" target=\"_blank\" rel=\"noopener\">kuvalähde\u003c/a>\u003c/small>\u003cbr>\u003cbr>\u003cstrong>Matka päättyy – tutkimus jatkuu\u003c/strong>\u003cbr>\u003cbr> Yhdeksän pysähdyksen jälkeen mielessä ei ole yksi kuva “Satakunnan viikingeistä”.\u003cbr>\u003cbr>Muistin perukoille jää elämään kiinnostavampi kokonaisuus: erilaisia hautaustapoja, puolustettu mäki, raudan tuotantoa, koruja ja aseita, rakennusten paalunjälkiä, vanhoihin hautoihin tehtyjä uusia hautauksia sekä löytöpaikkoja, joiden merkitystä tutkitaan parhaillaan.\u003cbr>\u003cbr>\u003cstrong>Arkeologian tärkein työväline ei ole valmis tarina vaan hyvä kysymys.\u003c/strong>","image":"https://ninalista.github.io/Rautakausiretki/images/11_lopetus_hankkasmaki_maisema_geolibre.jpg","alignment":"center","hidden":false,"location":{"center":[22.24,61.15],"zoom":9.35,"pitch":0,"bearing":0},"mapAnimation":"flyTo","rotateAnimation":false,"onChapterEnter":[],"onChapterExit":[]}]},"metadata":{"pilot":"VirtuViikinki","visibleContentScreens":14,"hiddenMapTransitions":8,"mainStops":9,"contentBasis":"VirtuViikinki aineistot","imagePolicy":"Images credited from source and source-linked.","updated":"9.8.2026","contentVersion":"1.3 human edited"}}</script>
